<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <!-- Adicionado user-scalable=no para evitar zoom no iPhone ao tentar clicar rápido -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Bom dia, Gatinha 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&display=swap" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .painel {
      position: relative;
      background-color: white;
      width: 90%;
      max-width: 400px;
      border-radius: 30px;
      text-align: center;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      z-index: 2;
    }

    h1 {
      color: #e91e63;
      font-family: 'Pacifico', cursive;
      font-size: 1.6em;
      margin-bottom: 15px;
    }

    h2 {
      color: #333;
      font-size: 1em;
      margin: 10px 0;
    }

    img {
      width: 100%;
      max-width: 220px;
      border-radius: 10px;
    }

    .botoes {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      /* Removido position relative daqui para o botão Não poder voar pela tela toda */
    }

    #sim, #nao {
      height: 45px;
      width: 90px;
      border-radius: 20px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10;
    }

    #sim {
      background-color: #e91e63;
      color: white;
      border: none;
    }

    #sim:hover {
      transform: scale(1.1);
    }

    #nao {
      background-color: #aaa;
      color: white;
      border: none;
    }

    /* Corações */
    .heart {
      position: fixed;
      top: -30px;
      font-size: 24px;
      animation: fall linear;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3em;
      }

      h2 {
        font-size: 0.95em;
      }

      #sim, #nao {
        width: 80px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>

  <div class="painel" id="painel">
    <h1>Boa tarde, Gatinha 💖</h1>
    <!-- Lembre-se de ter a imagem 'kotik.gif' na mesma pasta, ou usar uma URL direta -->
    <img src="./kotik.gif" alt="Gatinho fofo" />
    <h2>Vamos abrindo um espaço ai na tua agenda, quero sair com você essa semana. Aceita?</h2>

    <!-- AQUI ESTÃO OS BOTÕES -->
    <div class="botoes">
      <!-- TROQUE O NÚMERO ABAIXO PELO SEU (COM DDD). Ex: 5511999999999 -->
      <button id="sim" onclick="window.location.href='https://wa.me/5521994048385?text=Oi!%20Eu%20aceito%20sair%20com%20voc%C3%AA!%20%E2%9D%A4%EF%B8%8F'">Sim!</button>
      <button id="nao">Não</button>
    </div>
    
  </div>

  <script>
    const botaoNao = document.getElementById('nao');

    function fuja(e) {
      // Previne o clique de acontecer caso ela tente tocar na tela
      if(e) e.preventDefault(); 

      // Muda o botão para "fixed" para ele poder ir para qualquer lugar da tela do celular
      botaoNao.style.position = 'fixed';
      
      // Calcula o tamanho da tela para o botão não vazar para fora
      const maxX = window.innerWidth - botaoNao.offsetWidth - 20;
      const maxY = window.innerHeight - botaoNao.offsetHeight - 20;

      const randX = Math.random() * maxX;
      const randY = Math.random() * maxY;

      botaoNao.style.left = `${randX}px`;
      botaoNao.style.top = `${randY}px`;
    }

    // Funciona para Desktop (mouse) e Mobile (toque)
    botaoNao.addEventListener('mouseover', fuja);
    botaoNao.addEventListener('touchstart', fuja);
    botaoNao.addEventListener('click', fuja);

    // Corações caindo
    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }, 400);
  </script>

</body>
</html>
